<style id="css">
/* v57 */
/* Düzen: solda çizgili menü düğmesi ve soldan açılan çekmece, ortada dar editoryal sütun. Ana sayfada altın çerçeveli üyelik kartı. Tek, koyu ve elit bir görünüm. */
:root {
  --bg: #07080c;
  --bg2: #0b0c12;
  --surface: #10121a;
  --surface2: #161924;
  --line: #242836;
  --gold: #d8b56a;
  --gold-hi: #f2dda6;
  --gold-lo: #6f5a2c;
  --gold-ink: #171106;
  --fg: #eee9de;
  --muted: #9c9bad;
  --good: #7fd1a0;
  --warn: #ec7b70;
  --cool: #7cc7ea;
  --violet: #bba6ff;
  --font-display: 'Bodoni Moda', 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f4ee; --bg2: #ece9df; --surface: #ffffff; --surface2: #f1eee5; --line: #d8d2c2;
  --gold: #9a7424; --gold-hi: #6f510f; --gold-lo: #c7b27c; --gold-ink: #ffffff;
  --fg: #14120d; --muted: #5d5b66; --good: #1d7443; --warn: #b3372b; --cool: #1b6a90; --violet: #5a43b5;
  color-scheme: light;
}
:root[data-theme="light"] body { background-image: radial-gradient(900px 520px at 85% -8%, rgba(154,116,36,.10), transparent 62%); }
:root[data-theme="light"] .scrim, :root[data-theme="light"] .modal { background: rgba(20,18,13,.45); }
:root[data-theme="light"] .drawer { box-shadow: 8px 0 30px rgba(0,0,0,.15); }
.stat { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font: 500 .7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat.s-hazir { color: var(--cool); border-color: var(--cool); }
.stat.s-teslim { color: var(--good); border-color: var(--good); }
.stat.s-iptal { color: var(--warn); border-color: var(--warn); }
.stat.s-bekle { color: var(--gold); border-color: var(--gold-lo); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 520px at 85% -8%, rgba(216, 181, 106, .10), transparent 62%),
    radial-gradient(700px 480px at -12% 22%, rgba(124, 199, 234, .06), transparent 60%);
  background-repeat: no-repeat;
  color: var(--fg);
  font: 400 16px/1.65 var(--font-body);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 41; background: var(--surface);
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 500; line-height: 1.1; }
h3 { font: 700 1.05rem/1.3 var(--font-body); }
p { margin: 0; }
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pre { white-space: pre-line; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.wrap {
  width: 100%; max-width: 820px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-family: var(--font-mono); }

/* ---------- Düğmeler ve formlar ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--gold-ink);
  border: 1px solid var(--gold); border-radius: 3px; padding: 12px 18px;
  font: 600 .76rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
}
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-hi); filter: none; }
.btn.sm { padding: 7px 12px; font-size: .68rem; }
.btn.danger { background: transparent; color: var(--warn); border-color: rgba(236, 123, 112, .5); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form { display: grid; gap: 16px; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld > span, .fs > legend { font: 500 .7rem var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  width: 100%; min-width: 0; background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 3px;
  padding: 12px; font: 400 16px/1.4 var(--font-body);
}
textarea { resize: vertical; min-height: 84px; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; font-size: 0; }
.filebtn:focus-within { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.err { color: var(--warn); font-size: .9rem; }
.hint { color: var(--muted); font-size: .86rem; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
  font: 500 .72rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.chip.ok { color: var(--good); border-color: rgba(127, 209, 160, .45); }
.chip.warn { color: var(--gold-hi); border-color: var(--gold-lo); }
.chip.bad { color: var(--warn); border-color: rgba(236, 123, 112, .5); }

/* ---------- Güvenlik kontrolü ---------- */
.gate {
  position: fixed; inset: 0; z-index: 80; background: var(--bg);
  display: grid; place-items: center; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .5s ease, visibility .5s;
}
.gate.done { opacity: 0; visibility: hidden; }
.gate-card {
  width: 100%; max-width: 400px; display: grid; gap: 20px; padding: 26px 24px;
  border: 1px solid transparent; border-radius: 4px;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--gold-hi), var(--gold-lo) 45%, #2a2616 60%, var(--gold)) border-box;
}
.gate-top { display: flex; align-items: center; gap: 10px; color: var(--gold); font: 500 .72rem var(--font-mono); letter-spacing: .22em; text-transform: uppercase; }
.gate-top svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gate h1 { font-size: 1.75rem; font-style: italic; }
.gate .sub { color: var(--muted); font-size: .92rem; margin-top: 8px; }
.check {
  display: flex; align-items: center; gap: 14px; width: 100%; cursor: pointer; text-align: left;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px;
}
.check:hover { border-color: var(--gold); }
.check .box { width: 26px; height: 26px; flex: none; border-radius: 3px; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.check .box svg { width: 15px; height: 15px; opacity: 0; stroke: var(--gold-ink); }
.check.busy .box { border-color: var(--gold); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.check.ok .box { background: var(--good); border-color: var(--good); animation: none; }
.check.ok .box svg { opacity: 1; }
.check .lbl { font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font: 400 .82rem var(--font-mono); color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 10px; }
.steps li::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--line); flex: none; }
.steps li.ok { color: var(--fg); }
.steps li.ok::before { background: var(--good); }
.track { height: 3px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); transition: width .5s ease; }
.gate .msg { font: 500 .8rem var(--font-mono); color: var(--muted); min-height: 1.4em; }
@keyframes spin { to { transform: rotate(360deg); } }

.policy { max-height: 220px; overflow-y: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; display: grid; gap: 8px; font-size: .88rem; color: var(--muted); }
.policy h4 { margin: 6px 0 0; font: 700 .8rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.consent { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-weight: 600; }
.consent input { width: 22px; height: 22px; flex: none; margin: 1px 0 0; accent-color: var(--gold); padding: 0; }
/* ---------- Ban ekranı ---------- */
.ban {
  position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ban-card { width: 100%; max-width: 420px; border: 1px solid rgba(236, 123, 112, .5); border-radius: 4px; background: var(--surface); padding: 26px 24px; display: grid; gap: 18px; }
.ban-card h1 { font-size: clamp(1.5rem, 6vw, 1.9rem); font-style: italic; color: var(--warn); line-height: 1.2; }
.ban-card dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; }
.ban-card dt { font: 500 .7rem var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.ban-card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Başlık ve çekmece menü ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-lo), transparent); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 62px; }
.menu-btn {
  width: 46px; height: 46px; flex: none; display: grid; place-items: center; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--gold-lo); border-radius: 3px;
}
.menu-btn:hover { border-color: var(--gold); }
.burger { width: 22px; height: 16px; position: relative; display: block; }
.burger i { position: absolute; left: 0; right: 0; height: 2px; background: var(--gold-hi); border-radius: 1px; transition: transform .25s ease, top .25s ease, opacity .2s; }
.burger i:nth-child(1) { top: 0; }
.burger i:nth-child(2) { top: 7px; }
.burger i:nth-child(3) { top: 14px; }
.menu-btn[aria-expanded="true"] .burger i:nth-child(1) { top: 7px; transform: rotate(45deg); }
.menu-btn[aria-expanded="true"] .burger i:nth-child(2) { opacity: 0; }
.menu-btn[aria-expanded="true"] .burger i:nth-child(3) { top: 7px; transform: rotate(-45deg); }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; }
.brand b { font: italic 500 1.5rem/1 var(--font-display); color: var(--gold-hi); letter-spacing: .01em; }
.brand small { font: 400 .74rem var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; opacity: .3; }
.eq i { width: 3px; background: var(--gold); height: 30%; }
.playing .eq { opacity: 1; }
.playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
.playing .eq i:nth-child(2) { animation-delay: .2s; }
.playing .eq i:nth-child(3) { animation-delay: .4s; }
@keyframes eq { from { height: 25%; } to { height: 100%; } }
.acct { padding: 9px 14px; }
.scrim { position: fixed; inset: 0; z-index: 34; background: rgba(3, 4, 7, .78); backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s; }
.scrim.on { opacity: 1; visibility: visible; }
.drawer {
  position: fixed; z-index: 36; left: 0; bottom: 0; width: min(86vw, 330px);
  top: calc(env(safe-area-inset-top, 0px) + 63px);
  background: var(--surface); border-right: 1px solid var(--gold-lo); box-shadow: 8px 0 30px rgba(0,0,0,.5);
  transform: translateX(-102%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  overflow-y: auto; padding: 8px 14px calc(24px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.drawer.open { transform: none; }
.d-label { font: 500 .68rem var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); padding: 16px 10px 8px; margin-top: 10px; border-top: 1px solid var(--line); }
.drawer > .d-label:first-child { margin-top: 0; border-top: 0; padding-top: 14px; }
.d-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pages li:nth-child(3n):not(:nth-child(9)) { border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 6px; }
.d-list button {
  display: block; width: 100%; text-align: left; cursor: pointer; background: none; border: 0; border-left: 2px solid transparent; border-radius: 3px;
  padding: 10px 12px; font: 500 1rem/1.3 var(--font-body); color: var(--fg);
}
.d-list button:hover { background: var(--surface2); }
.d-list button[aria-current="page"] { border-left-color: var(--gold); color: var(--gold-hi); background: var(--surface2); }

/* ---------- İçerik ---------- */
main { padding-block: 26px 44px; }
.view { display: grid; gap: 22px; }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.title { font-size: clamp(2rem, 7vw, 2.9rem); font-style: italic; }
.title::after { content: ""; display: block; width: 56px; height: 1px; background: var(--gold); margin-top: 14px; }
.lead { color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; }
.pill { cursor: pointer; background: transparent; border: 1px solid var(--gold-lo); color: var(--gold-hi); border-radius: 999px; padding: 6px 14px; font: 500 .68rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; }
.pill:hover { border-color: var(--gold); }
.notice { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: start; border: 1px solid var(--gold-lo); background: var(--surface); border-radius: 4px; padding: 14px 16px; margin-bottom: 22px; }
.notice .lab { grid-column: 1 / -1; font: 500 .68rem var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.notice strong { font-weight: 700; display: block; }
.notice span.t { color: var(--muted); display: block; white-space: pre-line; }
.notice .x { cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 3px; width: 32px; height: 32px; color: var(--muted); }
.notice .x:hover { border-color: var(--gold); color: var(--gold-hi); }

/* Üyelik kartı */
.idcard {
  border: 1px solid transparent; border-radius: 4px; position: relative;
  background: linear-gradient(160deg, var(--surface2), var(--surface) 55%) padding-box, linear-gradient(135deg, var(--gold-hi), var(--gold-lo) 38%, #2a2616 58%, var(--gold) 100%) border-box;
}
.idbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); font: 500 .68rem var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.online { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.online i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(127, 209, 160, .18); }
.idbody { display: flex; gap: 22px; padding: 24px 18px 10px; align-items: flex-start; }
.monogram {
  width: 96px; height: 96px; flex: none; display: grid; place-items: center; border: 1px solid var(--gold-lo); border-radius: 3px; position: relative;
  font: italic 500 3.4rem/1 var(--font-display); color: var(--gold-hi); background: var(--bg2);
}
.monogram::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(216, 181, 106, .25); border-radius: 2px; pointer-events: none; }
.idmain { min-width: 0; display: grid; gap: 6px; }
.idmain h1 { font-size: clamp(2.8rem, 12vw, 4.4rem); font-style: italic; color: var(--fg); letter-spacing: -.01em; }
.handle { font: 500 .9rem var(--font-mono); color: var(--gold); letter-spacing: .04em; }
.idtext { padding: 6px 18px 22px; color: var(--muted); max-width: 60ch; white-space: pre-line; }
.badges { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.badge {
  --c: var(--gold);
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 8px; border-radius: 2px; cursor: default;
  color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 10%, var(--surface));
  font: 500 .7rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
}
.badge svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.t-owner { --c: var(--gold-hi); }
.t-ban { --c: var(--warn); }
.t-koy { --c: var(--good); }
.t-kurucu { --c: var(--violet); }
.t-mod { --c: var(--cool); }

/* Müzik çalar */
.player { display: grid; gap: 16px; }
.player-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.player-head h2 { font-size: 1.7rem; font-style: italic; }
.np { background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; min-width: 0; }
.np-title { font: 700 1.02rem var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-sub { color: var(--muted); font-size: .86rem; margin-top: 2px; }
.controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
.ic { width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; background: var(--bg2); border: 1px solid var(--line); }
.ic:hover:not(:disabled) { border-color: var(--gold); }
.ic:disabled { opacity: .4; cursor: not-allowed; }
.ic svg { width: 18px; height: 18px; fill: currentColor; }
.ic.main { width: 58px; height: 58px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border-color: var(--gold); color: var(--gold-ink); }
.ic.main svg { width: 22px; height: 22px; }
.seek { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; font: 400 .78rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.vol { display: flex; align-items: center; gap: 12px; font: 500 .7rem var(--font-mono); color: var(--muted); letter-spacing: .16em; text-transform: uppercase; }
input[type="range"] { accent-color: var(--gold); padding: 0; background: none; border: 0; }
.vol input { flex: 1; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: t; }
.list li { counter-increment: t; }
.list button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; min-width: 0; }
.list button::before { content: counter(t, decimal-leading-zero); font: 400 .74rem var(--font-mono); color: var(--muted); flex: none; }
.list button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.list button:hover { border-color: var(--gold); }
.list button[aria-current="true"] { border-color: var(--gold); color: var(--gold-hi); background: var(--surface2); }

    raw.forEach(function (w) { if (w.length === 1) run += w; else { if (run) { toks.push(run); run = ''; } toks.push(w); } });
    if (run) toks.push(run);
